name: Eval Gate

# Answer-quality regression gate: any PR that touches the pipeline's
# behavior (prompts, graph topology, agent schemas, eval suite) must
# hold the line on the LangSmith eval scores committed in
# evals/baseline.json. A red check here means the change made the
# research measurably worse — merge is blocked until fixed or the
# baseline is deliberately re-set with --update-baseline.

on:
  pull_request:
    paths:
      - "graph/**"
      - "agents/**"
      - "schemas/**"
      - "evals/**"
      - "config.py"

jobs:
  quality-gate:
    name: LangSmith answer-quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for eval credentials
        id: creds
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$LANGSMITH_API_KEY" ] || [ -z "$OPENROUTER_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LANGSMITH_API_KEY / OPENROUTER_API_KEY secrets not configured — eval gate skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.available == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.creds.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run eval suite against baseline
        if: steps.creds.outputs.available == 'true'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: aro-ci-evals
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m evals.run_evals --mode fast
