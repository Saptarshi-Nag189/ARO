name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run test suite (offline, deterministic fake model)
        env:
          ARO_FAKE_MODEL: "1"
        run: pytest tests/ -v --tb=short
